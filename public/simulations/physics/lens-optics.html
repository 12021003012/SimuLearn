<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lens Optics - Ray Diagrams</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; }
#panel { position: absolute; top: 10px; left: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; width: 210px; z-index: 10; }
#panel h3 { font-size: 13px; margin-bottom: 8px; color: #e2e8f0; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 6px; background: #334155; border: none; color: #94a3b8; border-radius: 6px; cursor: pointer; font-size: 10px; }
.tabs button.active { background: #0ea5e9; color: white; }
.ctrl { margin-bottom: 10px; }
.ctrl label { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
.ctrl label span { color: #38bdf8; font-weight: bold; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: #334155; border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #38bdf8; cursor: pointer; }
.readings { margin-top: 10px; padding: 8px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 10px; color: #94a3b8; }
.readings .row { display: flex; justify-content: space-between; padding: 2px 0; }
.readings .row span:last-child { color: #4ade80; font-family: monospace; }
.formula { margin-top: 8px; text-align: center; font-family: monospace; font-size: 11px; color: #a78bfa; padding: 6px; background: #1e1b4b; border-radius: 4px; }
</style>
</head>
<body>
<div id="panel">
  <h3>🔍 Lens Optics</h3>
  <div class="tabs">
    <button class="active" id="btn-convex" onclick="setLens('convex')">Convex (+)</button>
    <button id="btn-concave" onclick="setLens('concave')">Concave (-)</button>
  </div>
  <div class="ctrl">
    <label>Object Distance (u) <span id="u-val">-150 px</span></label>
    <input type="range" id="u-slider" min="40" max="400" value="150">
  </div>
  <div class="ctrl">
    <label>Object Height <span id="h-val">60 px</span></label>
    <input type="range" id="h-slider" min="20" max="120" value="60">
  </div>
  <div class="ctrl">
    <label>Focal Length (f) <span id="f-val">80 px</span></label>
    <input type="range" id="f-slider" min="40" max="200" value="80">
  </div>
  <div class="readings">
    <div class="row"><span>Image dist (v):</span><span id="v-display">-</span></div>
    <div class="row"><span>Magnification:</span><span id="m-display">-</span></div>
    <div class="row"><span>Image type:</span><span id="type-display">-</span></div>
  </div>
  <div class="formula">1/v - 1/u = 1/f</div>
</div>
<script>
let lensType = 'convex';
let objectDist = 150;
let objectHeight = 60;
let focalLength = 80;

document.getElementById('u-slider').addEventListener('input', function() { objectDist = parseFloat(this.value); document.getElementById('u-val').textContent = '-' + objectDist + ' px'; });
document.getElementById('h-slider').addEventListener('input', function() { objectHeight = parseFloat(this.value); document.getElementById('h-val').textContent = objectHeight + ' px'; });
document.getElementById('f-slider').addEventListener('input', function() { focalLength = parseFloat(this.value); document.getElementById('f-val').textContent = focalLength + ' px'; });

function setLens(type) {
  lensType = type;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + type).classList.add('active');
}

function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function draw() {
  background(15, 23, 42);
  
  let cx = width * 0.5;
  let cy = height * 0.5;
  let f = lensType === 'convex' ? focalLength : -focalLength;
  let u = -objectDist; // Object on left, negative u
  
  // Calculate image using lens formula: 1/v - 1/u = 1/f
  // => 1/v = 1/f + 1/u
  let oneOverV = 1/f + 1/u;
  let v = oneOverV !== 0 ? 1 / oneOverV : Infinity;
  let magnification = v / u;
  let imageHeight = -magnification * objectHeight;
  
  // Update display
  let isReal = v > 0;
  document.getElementById('v-display').textContent = (v === Infinity ? '∞' : v.toFixed(0)) + ' px';
  document.getElementById('m-display').textContent = magnification.toFixed(2) + 'x';
  document.getElementById('type-display').textContent = 
    (isReal ? 'Real, ' : 'Virtual, ') + 
    (Math.abs(magnification) > 1 ? 'Enlarged' : Math.abs(magnification) < 1 ? 'Diminished' : 'Same size') +
    (magnification > 0 ? ', Erect' : ', Inverted');
  
  // === Draw principal axis ===
  stroke(71, 85, 105);
  strokeWeight(1);
  line(0, cy, width, cy);
  
  // === Draw lens ===
  stroke(56, 189, 248, 200);
  strokeWeight(2);
  noFill();
  
  let lensH = 180;
  if (lensType === 'convex') {
    // Convex lens (double convex shape)
    arc(cx - 20, cy, 60, lensH, -HALF_PI, HALF_PI);
    arc(cx + 20, cy, 60, lensH, HALF_PI, -HALF_PI);
  } else {
    // Concave lens
    arc(cx - 30, cy, 60, lensH, -HALF_PI, HALF_PI);
    arc(cx + 30, cy, 60, lensH, HALF_PI, -HALF_PI);
    line(cx - 5, cy - lensH/2, cx + 5, cy - lensH/2);
    line(cx - 5, cy + lensH/2, cx + 5, cy + lensH/2);
  }
  
  // Optical center
  fill(255);
  noStroke();
  ellipse(cx, cy, 6, 6);
  
  // === Draw focal points ===
  fill(251, 146, 60);
  noStroke();
  ellipse(cx + f, cy, 8, 8);
  ellipse(cx - f, cy, 8, 8);
  
  textSize(10);
  fill(251, 146, 60);
  textAlign(CENTER);
  text('F', cx + f, cy + 18);
  text('F', cx - f, cy + 18);
  
  // 2F points
  fill(100, 116, 139);
  ellipse(cx + 2*f, cy, 6, 6);
  ellipse(cx - 2*f, cy, 6, 6);
  fill(100, 116, 139);
  textSize(8);
  text('2F', cx + 2*f, cy + 15);
  text('2F', cx - 2*f, cy + 15);
  
  // === Draw Object ===
  let objX = cx + u; // u is negative, so object is to the left
  let objTopY = cy - objectHeight;
  
  stroke(74, 222, 128);
  strokeWeight(3);
  line(objX, cy, objX, objTopY);
  // Arrow head
  fill(74, 222, 128);
  noStroke();
  triangle(objX - 6, objTopY + 10, objX + 6, objTopY + 10, objX, objTopY);
  
  textSize(10);
  text('Object', objX, cy + 18);
  
  // === Draw Image ===
  if (v !== Infinity && Math.abs(v) < 1000) {
    let imgX = cx + v;
    let imgTopY = cy - imageHeight;
    
    if (isReal) {
      // Real image - solid line
      stroke(239, 68, 68);
      strokeWeight(3);
    } else {
      // Virtual image - dashed
      stroke(239, 68, 68);
      strokeWeight(2);
      drawingContext.setLineDash([5, 5]);
    }
    
    line(imgX, cy, imgX, imgTopY);
    // Arrow head
    fill(239, 68, 68);
    noStroke();
    if (imageHeight > 0) {
      triangle(imgX - 6, imgTopY + 10, imgX + 6, imgTopY + 10, imgX, imgTopY);
    } else {
      triangle(imgX - 6, imgTopY - 10, imgX + 6, imgTopY - 10, imgX, imgTopY);
    }
    drawingContext.setLineDash([]);
    
    textSize(10);
    fill(239, 68, 68);
    textAlign(CENTER);
    text('Image', imgX, cy + 18);
    
    // === Draw Ray Diagram (3 principal rays) ===
    // Ray 1: Parallel to axis → through F
    stroke(251, 191, 36, 180);
    strokeWeight(1.5);
    // Incoming ray
    line(objX, objTopY, cx, objTopY);
    // After lens
    if (lensType === 'convex') {
      line(cx, objTopY, cx + Math.max(v, 300), cy + (objTopY - cy) * (1 - Math.max(v, 300)/f));
    } else {
      // Diverging - appears to come from F on same side
      line(cx, objTopY, imgX, imgTopY);
      // Virtual extension
      stroke(251, 191, 36, 60);
      drawingContext.setLineDash([3, 5]);
      line(cx, objTopY, cx + f, cy);
      drawingContext.setLineDash([]);
    }
    
    // Ray 2: Through center → straight
    stroke(168, 85, 247, 180);
    strokeWeight(1.5);
    line(objX, objTopY, imgX, imgTopY);
    
    // Ray 3: Through F → parallel after lens
    if (lensType === 'convex' && objectDist > focalLength) {
      stroke(74, 222, 128, 150);
      strokeWeight(1.5);
      // Calculate where ray hits lens
      let slope = (objTopY - cy) / (objX - (cx - f));
      let lensY = cy + slope * (cx - (cx - f) + (objectDist - focalLength));
      line(objX, objTopY, cx, lensY);
      line(cx, lensY, cx + 400, lensY);
    }
  }
  
  // Labels
  noStroke();
  fill(148, 163, 184);
  textSize(11);
  textAlign(LEFT);
  text('Lens Type: ' + (lensType === 'convex' ? 'Converging (Convex)' : 'Diverging (Concave)'), 240, 30);
  
  fill(100, 116, 139);
  textSize(9);
  textAlign(LEFT);
  text('Real-world: Human eye (convex), magnifying glass, camera lens, corrective spectacles', 240, height - 15);
  
  // Legend
  fill(251, 191, 36);
  textSize(9);
  textAlign(RIGHT);
  text('— Ray 1 (parallel → F)', width - 20, 20);
  fill(168, 85, 247);
  text('— Ray 2 (through center)', width - 20, 35);
  fill(74, 222, 128, 150);
  text('— Ray 3 (through F → parallel)', width - 20, 50);
}
</script>
</body>
</html>

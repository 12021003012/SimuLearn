<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wave Interference Pattern</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; }
#controls { position: absolute; top: 10px; left: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; width: 200px; z-index: 10; }
.ctrl { margin-bottom: 10px; }
.ctrl label { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
.ctrl label span { color: #38bdf8; font-weight: bold; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: #334155; border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #38bdf8; cursor: pointer; }
h3 { font-size: 12px; color: #e2e8f0; margin-bottom: 10px; }
.info { font-size: 9px; color: #64748b; margin-top: 10px; padding-top: 8px; border-top: 1px solid #334155; line-height: 1.4; }
</style>
</head>
<body>
<div id="controls">
  <h3>Wave Interference</h3>
  <div class="ctrl">
    <label>Wavelength <span id="wl-val">40 px</span></label>
    <input type="range" id="wavelength" min="15" max="80" value="40">
  </div>
  <div class="ctrl">
    <label>Source Separation <span id="sep-val">120 px</span></label>
    <input type="range" id="separation" min="30" max="300" value="120">
  </div>
  <div class="ctrl">
    <label>Frequency <span id="freq-val">2.0 Hz</span></label>
    <input type="range" id="frequency" min="0.5" max="5" value="2" step="0.1">
  </div>
  <div class="ctrl">
    <label>Amplitude <span id="amp-val">1.0</span></label>
    <input type="range" id="amplitude" min="0.2" max="2" value="1" step="0.1">
  </div>
  <div class="info">
    Real-world: Noise-cancelling headphones use destructive interference to cancel sound waves. Light interference creates rainbow patterns on soap bubbles.
  </div>
</div>
<script>
let wavelength = 40, separation = 120, freq = 2.0, amp = 1.0;
let time = 0;

document.getElementById('wavelength').addEventListener('input', function() { wavelength = parseFloat(this.value); document.getElementById('wl-val').textContent = wavelength + ' px'; });
document.getElementById('separation').addEventListener('input', function() { separation = parseFloat(this.value); document.getElementById('sep-val').textContent = separation + ' px'; });
document.getElementById('frequency').addEventListener('input', function() { freq = parseFloat(this.value); document.getElementById('freq-val').textContent = freq.toFixed(1) + ' Hz'; });
document.getElementById('amplitude').addEventListener('input', function() { amp = parseFloat(this.value); document.getElementById('amp-val').textContent = amp.toFixed(1); });

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function draw() {
  background(15, 23, 42);
  time += 0.02 * freq;
  
  let s1x = width / 2;
  let s1y = height / 2 - separation / 2;
  let s2x = width / 2;
  let s2y = height / 2 + separation / 2;
  
  // Compute interference pattern using pixels
  loadPixels();
  let k = TWO_PI / wavelength;
  
  for (let x = 0; x < width; x += 3) {
    for (let y = 0; y < height; y += 3) {
      let d1 = dist(x, y, s1x, s1y);
      let d2 = dist(x, y, s2x, s2y);
      
      let wave1 = amp * sin(k * d1 - time * TWO_PI);
      let wave2 = amp * sin(k * d2 - time * TWO_PI);
      let combined = (wave1 + wave2) / 2;
      
      // Color mapping
      let intensity = map(combined, -amp, amp, 0, 255);
      let idx = (y * width + x) * 4;
      
      // Blue-white-blue colormap
      if (combined > 0) {
        pixels[idx] = intensity * 0.22;    // R
        pixels[idx+1] = intensity * 0.74;  // G
        pixels[idx+2] = intensity * 0.97;  // B
      } else {
        pixels[idx] = -combined / amp * 80;
        pixels[idx+1] = -combined / amp * 30;
        pixels[idx+2] = -combined / amp * 120;
      }
      pixels[idx+3] = 200;
      
      // Fill 3x3 block
      for (let dx = 0; dx < 3 && x+dx < width; dx++) {
        for (let dy = 0; dy < 3 && y+dy < height; dy++) {
          let i2 = ((y+dy) * width + (x+dx)) * 4;
          pixels[i2] = pixels[idx];
          pixels[i2+1] = pixels[idx+1];
          pixels[i2+2] = pixels[idx+2];
          pixels[i2+3] = pixels[idx+3];
        }
      }
    }
  }
  updatePixels();
  
  // Draw sources
  fill(251, 146, 60);
  noStroke();
  ellipse(s1x, s1y, 12, 12);
  ellipse(s2x, s2y, 12, 12);
  
  // Pulsing rings from sources
  noFill();
  strokeWeight(1);
  for (let r = 0; r < 6; r++) {
    let radius = ((time * wavelength + r * wavelength) % (width * 0.6));
    let alpha = map(radius, 0, width * 0.6, 150, 0);
    stroke(251, 146, 60, alpha);
    ellipse(s1x, s1y, radius * 2, radius * 2);
    ellipse(s2x, s2y, radius * 2, radius * 2);
  }
  
  // Labels
  noStroke();
  fill(251, 146, 60);
  textSize(10);
  textAlign(CENTER);
  text('Source 1', s1x, s1y - 15);
  text('Source 2', s2x, s2y + 22);
  
  // Constructive/Destructive labels
  fill(74, 222, 128, 180);
  textSize(9);
  textAlign(RIGHT);
  text('Bright = Constructive Interference', width - 10, height - 30);
  fill(168, 85, 247, 180);
  text('Dark = Destructive Interference', width - 10, height - 15);
}
</script>
</body>
</html>

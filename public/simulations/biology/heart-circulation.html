<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Heart Circulation Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; }
#info { position: absolute; top: 10px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; width: 220px; z-index: 10; font-size: 11px; }
#info h3 { font-size: 13px; margin-bottom: 8px; color: #e2e8f0; }
#info p { color: #94a3b8; margin-bottom: 6px; line-height: 1.4; }
#info .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #334155; }
#info .stat span:last-child { color: #38bdf8; font-weight: bold; }
.ctrl { margin-top: 10px; }
.ctrl label { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
.ctrl label span { color: #fb923c; font-weight: bold; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: #334155; border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fb923c; cursor: pointer; }
</style>
</head>
<body>
<div id="info">
  <h3>❤️ Heart Circulation</h3>
  <div class="stat"><span>Heart Rate</span><span id="hr-display">72 BPM</span></div>
  <div class="stat"><span>Phase</span><span id="phase-display">Systole</span></div>
  <div class="stat"><span>Blood Flow</span><span id="flow-display">5.0 L/min</span></div>
  <div class="ctrl">
    <label>Heart Rate <span id="hr-val">72 BPM</span></label>
    <input type="range" id="hr-slider" min="40" max="180" value="72">
  </div>
  <p style="margin-top:10px; font-size:9px; color:#64748b;">
    Blue = deoxygenated blood<br>
    Red = oxygenated blood<br>
    Watch valves open/close with each beat
  </p>
</div>
<script>
let heartRate = 72;
let time = 0;
let particles = [];
const MAX_PARTICLES = 80;

document.getElementById('hr-slider').addEventListener('input', function() {
  heartRate = parseInt(this.value);
  document.getElementById('hr-val').textContent = heartRate + ' BPM';
  document.getElementById('hr-display').textContent = heartRate + ' BPM';
  document.getElementById('flow-display').textContent = (heartRate * 0.07).toFixed(1) + ' L/min';
});

function setup() {
  createCanvas(windowWidth, windowHeight);
  // Initialize blood particles
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(createParticle(i));
  }
}

function createParticle(i) {
  let pathPos = (i / MAX_PARTICLES) * TWO_PI * 2;
  return { pathPos, speed: 0.02 + random(0.01) };
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function draw() {
  background(15, 23, 42);
  time += 0.016;
  
  let cx = width * 0.4;
  let cy = height * 0.5;
  let beatCycle = (time * heartRate / 60) % 1;
  let beatPulse = sin(beatCycle * TWO_PI) * 0.5 + 0.5;
  let scale = 1 + beatPulse * 0.05;
  
  // Update phase display
  let phase = beatCycle < 0.35 ? 'Systole (Contraction)' : 'Diastole (Relaxation)';
  document.getElementById('phase-display').textContent = phase;
  
  push();
  translate(cx, cy);
  
  // === Draw Heart Chambers ===
  let heartW = 200 * scale;
  let heartH = 220 * scale;
  
  // Right Atrium (top-right, blue)
  fill(30, 58, 138, 180);
  stroke(59, 130, 246);
  strokeWeight(2);
  ellipse(50, -50, heartW * 0.4, heartH * 0.35);
  
  // Right Ventricle (bottom-right, blue)  
  fill(30, 58, 138, 200);
  stroke(59, 130, 246);
  ellipse(40, 40, heartW * 0.35, heartH * 0.45);
  
  // Left Atrium (top-left, red)
  fill(127, 29, 29, 180);
  stroke(239, 68, 68);
  ellipse(-50, -50, heartW * 0.4, heartH * 0.35);
  
  // Left Ventricle (bottom-left, red)
  fill(127, 29, 29, 200);
  stroke(239, 68, 68);
  ellipse(-40, 40, heartW * 0.4, heartH * 0.5);
  
  // Septum (center wall)
  stroke(148, 163, 184);
  strokeWeight(3);
  line(0, -80, 0, 100);
  
  // Valves
  let valveOpen = beatCycle < 0.35;
  
  // Tricuspid valve (right side)
  drawValve(45, -10, valveOpen, '#3b82f6');
  // Mitral valve (left side)
  drawValve(-45, -10, valveOpen, '#ef4444');
  // Pulmonary valve (top right)
  drawValve(60, -85, !valveOpen, '#3b82f6');
  // Aortic valve (top left)
  drawValve(-60, -85, !valveOpen, '#ef4444');
  
  // Chamber labels
  noStroke();
  fill(255, 255, 255, 200);
  textSize(9);
  textAlign(CENTER);
  text('RA', 50, -48);
  text('RV', 40, 45);
  text('LA', -50, -48);
  text('LV', -40, 45);
  
  pop();
  
  // === Draw Blood Vessels ===
  // Pulmonary artery (to lungs - blue)
  stroke(59, 130, 246);
  strokeWeight(8);
  noFill();
  bezier(cx + 60, cy - 110, cx + 100, cy - 180, cx + 200, cy - 180, cx + 250, cy - 120);
  
  // Pulmonary vein (from lungs - red)
  stroke(239, 68, 68);
  bezier(cx - 250, cy - 120, cx - 200, cy - 180, cx - 100, cy - 180, cx - 60, cy - 110);
  
  // Aorta (from left ventricle - red)
  stroke(239, 68, 68);
  strokeWeight(10);
  bezier(cx - 60, cy - 85, cx - 80, cy - 160, cx - 40, cy - 200, cx + 20, cy - 200);
  bezier(cx + 20, cy - 200, cx + 80, cy - 200, cx + 120, cy - 160, cx + 120, cy + 50);
  
  // Vena Cava (to right atrium - blue)
  stroke(59, 130, 246);
  strokeWeight(8);
  line(cx + 120, cy + 50, cx + 120, cy + 150);
  bezier(cx + 120, cy + 150, cx + 100, cy + 180, cx + 70, cy + 100, cx + 55, cy + 60);
  
  // === Animate blood particles ===
  let pSpeed = map(heartRate, 40, 180, 0.01, 0.05);
  
  for (let p of particles) {
    p.pathPos += pSpeed + (beatPulse * 0.02);
    if (p.pathPos > TWO_PI * 2) p.pathPos -= TWO_PI * 2;
    
    let pos = getPathPosition(p.pathPos, cx, cy);
    let isOxygenated = p.pathPos > PI && p.pathPos < TWO_PI * 1.5;
    
    noStroke();
    if (isOxygenated) {
      fill(239, 68, 68, 200);
    } else {
      fill(59, 130, 246, 200);
    }
    ellipse(pos.x, pos.y, 6, 6);
  }
  
  // === Lung labels ===
  noStroke();
  fill(148, 163, 184);
  textSize(12);
  textAlign(CENTER);
  text('🫁 Lungs', cx, cy - 200);
  text('(O₂ exchange)', cx, cy - 185);
  
  fill(100, 116, 139);
  textSize(10);
  textAlign(LEFT);
  text('Body Tissues', cx + 130, cy + 170);
  
  // Title
  fill(148, 163, 184);
  textSize(11);
  textAlign(LEFT);
  text('Double Circulation: Pulmonary + Systemic', 10, height - 10);
  
  // Beat indicator
  fill(239, 68, 68, beatPulse * 255);
  noStroke();
  ellipse(30, 30, 20 + beatPulse * 10, 20 + beatPulse * 10);
  fill(255);
  textSize(10);
  textAlign(CENTER);
  text('♥', 30, 34);
}

function getPathPosition(t, cx, cy) {
  // Simplified circular path around the heart
  let radius = 120;
  let x = cx + cos(t) * radius * 1.2;
  let y = cy + sin(t) * radius * 0.8;
  
  // Add some variation
  x += sin(t * 3) * 20;
  y += cos(t * 2) * 15;
  
  return { x, y };
}

function drawValve(x, y, open, color) {
  push();
  translate(x, y);
  stroke(color);
  strokeWeight(2);
  if (open) {
    // Open valve - lines apart
    line(-8, -5, -3, 0);
    line(-3, 0, -8, 5);
    line(8, -5, 3, 0);
    line(3, 0, 8, 5);
  } else {
    // Closed valve - lines together
    line(-8, -5, 0, 0);
    line(0, 0, -8, 5);
    line(8, -5, 0, 0);
    line(0, 0, 8, 5);
  }
  pop();
}
</script>
</body>
</html>
